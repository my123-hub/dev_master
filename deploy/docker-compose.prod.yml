# STK 本然家居 —— 生产编排（NFR-21/23）
# 本文件位于 deploy/ 目录，所有相对路径以 deploy/ 为基准。
# 一键上线：
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
#
# 服务拓扑：
#   nginx(边缘, 80/8080) → web / admin 静态 + /api 反代 api:8000
#   api:8000 → postgres:16（数据库）
#   uploads：api 写入、nginx 静态托管的共享卷
#
# 说明：
#   - 数据库密码 / JWT 密钥等敏感项来自 .env.prod（已被 .gitignore 排除，不提交）
#   - 生产 HTTPS 见 deploy/nginx.conf 内「TLS 模板」注释
#   - 每日备份见 deploy/backup.sh（由宿主机 cron 调用）

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stk_db}
      POSTGRES_USER: ${POSTGRES_USER:-stk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup:/backup
      - ./backup.sh:/backup/backup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stk}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: ../api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stk_db}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_DIR: /uploads
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ../frontend
    restart: unless-stopped

  admin:
    build: ../backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
      - "${ADMIN_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - uploads:/uploads:ro
    depends_on:
      - api
      - web
      - admin
    restart: unless-stopped

volumes:
  pgdata:
  uploads:

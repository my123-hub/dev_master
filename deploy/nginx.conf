# STK 本然家居 —— 生产边缘 Nginx 配置
# 职责：统一接入 + 静态托管 + 反代
#   80    = 前台官网（web）
#   8080  = 后台管理（admin）
#   /api  = 反代 FastAPI（api 容器）
#   /static/uploads = 映射上传卷（uploads）
#
# ⚠️ 生产 HTTPS：取消「TLS 模板」段落注释，并把证书挂载到 /etc/nginx/certs
#    （fullchain.pem / privkey.pem，证书需自行申请，如 Let's Encrypt）。
#    启用 HTTPS 后，将 80 端口 server 内的 `return 302` 注释取消以强制跳转。

events {
    worker_connections 1024;
}

http {
    upstream api_up {
        server api:8000;
    }

    # 反向代理公共头（透传真实客户端信息）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ============ 前台官网（web）============
    server {
        listen 80;
        server_name _;

        # ---- TLS 模板（生产启用 HTTPS 时取消注释）----
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # # 80 → 443 强制跳转（启用 HTTPS 后取消下一行注释）
        # return 302 https://$host$request_uri;

        # 接口反代（保留 /api 前缀，交由 FastAPI 路由处理）
        location /api/ {
            proxy_pass http://api_up;
        }

        # 上传文件静态访问
        location /static/uploads/ {
            alias /uploads/;
        }

        # 其余请求交由前台 SPA 处理
        location / {
            proxy_pass http://web:80;
        }
    }

    # ============ 后台管理（admin）============
    server {
        listen 8080;
        server_name _;

        # ---- TLS 模板（如后台独立域名启用 HTTPS）----
        # listen 8443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location /api/ {
            proxy_pass http://api_up;
        }

        location /static/uploads/ {
            alias /uploads/;
        }

        location / {
            proxy_pass http://admin:80;
        }
    }
}

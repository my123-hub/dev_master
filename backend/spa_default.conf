# 单页应用（SPA）Nginx 默认站点配置
# 用于 web / admin 两个前端构建镜像：托管静态产物并支持前端路由 history 回退
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（BrowserRouter）回退：未知路径交由 index.html 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 hash 文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
